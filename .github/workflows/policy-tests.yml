name: BareGhost policy tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run format policy tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q integration
